<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carte</title>
</head>
<body>
    <nav>
        <table border="2">
    <caption>Carte des prix — tarifs au kilogramme, TTC</caption>
    <thead>
        <tr>
            <th scope="col">Catégorie</th>
            <th scope="col">Produit</th>
            <th scope="col">Prix (DT)</th>
        </tr>
    </thead>
    <tbody>
        <!-- Le sucré fin -->
        <tr>
            <th scope="rowgroup" rowspan="4">Le sucré fin</th>
            <td>Chocolats</td>
            <td>45</td>
        </tr>
        <tr>
            <td>Gâteaux</td>
            <td>50</td>
        </tr>
        <tr>
            <td>Morceaux</td>
            <td>6</td>
        </tr>
        <tr>
            <td>Glaces</td>
            <td>4</td>
        </tr>

        <!-- Le salé fin -->
        <tr>
            <th scope="rowgroup" rowspan="3">Le salé fin</th>
            <td>Bouchées froides</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Brochettes</td>
            <td>70</td>
        </tr>
        <tr>
            <td>Verrines froides</td>
            <td>100</td>
        </tr>

        <!-- Pains & viennoiseries -->
        <tr>
            <th scope="rowgroup" rowspan="2">Pains viennoiseries</th>
            <td>Pains</td>
            <td>1</td>
        </tr>
        <tr>
            <td>Viennoiseries</td>
            <td>3</td>
        </tr>

        <!-- L'épicerie fine -->
        <tr>
            <th scope="rowgroup" rowspan="3">L'épicerie fine</th>
            <td>Confitures</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Miels</td>
            <td>50</td>
        </tr>
        <tr>
            <td>Granola</td>
            <td>60</td>
        </tr>
    </tbody>
</table>
    </nav>
    
</body>
</html>
